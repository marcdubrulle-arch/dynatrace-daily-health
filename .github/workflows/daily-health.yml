name: Daily Dynatrace Health

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Dynatrace configuration
        env:
          DYNATRACE_BASE_URL: ${{ secrets.DYNATRACE_BASE_URL }}
          DYNATRACE_API_TOKEN: ${{ secrets.DYNATRACE_API_TOKEN }}
        run: |
          if [ -z "${DYNATRACE_BASE_URL}" ]; then
            echo "::error::DYNATRACE_BASE_URL secret is missing or empty"
            exit 1
          fi
          if [ -z "${DYNATRACE_API_TOKEN}" ]; then
            echo "::error::DYNATRACE_API_TOKEN secret is missing or empty"
            exit 1
          fi
          case "${DYNATRACE_BASE_URL}" in
            https://*|http://*) ;;
            *)
              echo "::error::DYNATRACE_BASE_URL must start with https:// or http://"
              exit 1
              ;;
          esac
          echo "Validated DYNATRACE_BASE_URL host: ${DYNATRACE_BASE_URL#*://}"
          echo "Validated DYNATRACE_API_TOKEN length: ${#DYNATRACE_API_TOKEN}"

          # Simple connectivity/auth check before running the full report.
          CHECK_URL="${DYNATRACE_BASE_URL%/}/api/v2/problems?pageSize=1"
          HTTP_CODE=$(curl -sS -o /tmp/dynatrace_check.json -w "%{http_code}" \
            -H "Accept: application/json" \
            -H "Authorization: Api-Token ${DYNATRACE_API_TOKEN}" \
            "${CHECK_URL}")
          if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
            echo "::error::Dynatrace access check failed (HTTP ${HTTP_CODE}) on /api/v2/problems?pageSize=1"
            echo "Response preview:"
            head -c 500 /tmp/dynatrace_check.json || true
            exit 1
          fi
          echo "Dynatrace access check passed (HTTP ${HTTP_CODE})"

      - name: Generate report
        env:
          DYNATRACE_BASE_URL: ${{ secrets.DYNATRACE_BASE_URL }}
          DYNATRACE_API_TOKEN: ${{ secrets.DYNATRACE_API_TOKEN }}
          DYNATRACE_PROBLEM_SELECTOR: ${{ vars.DYNATRACE_PROBLEM_SELECTOR }}
          DYNATRACE_AVAILABILITY_METRIC_SELECTOR: ${{ vars.DYNATRACE_AVAILABILITY_METRIC_SELECTOR }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python run_daily.py

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: dynatrace-daily-health
          path: reports/
